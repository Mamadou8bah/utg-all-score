services:
  admin-app:
    build:
      context: ../../admin-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PUBLIC_SITE_URL: ${NEXT_PUBLIC_PUBLIC_SITE_URL}
    container_name: utg_allscore_admin
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: "3001"
