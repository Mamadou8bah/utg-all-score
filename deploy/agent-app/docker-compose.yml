services:
  agent-app:
    build:
      context: ../../agent-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PUBLIC_SITE_URL: ${NEXT_PUBLIC_PUBLIC_SITE_URL}
    container_name: utg_allscore_agent
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3002"
    environment:
      PORT: "3002"
